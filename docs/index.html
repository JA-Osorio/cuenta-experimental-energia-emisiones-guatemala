<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Energía y emisiones de Guatemala, 2018–2024 · Material complementario</title>
  <style>
    :root{color-scheme:light}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f8;color:#092d43;font:16px/1.5 system-ui,sans-serif}
    .c{text-align:center;padding:2rem;max-width:36rem}
    .s{width:38px;height:38px;margin:0 auto 1rem;border:4px solid #cfe5df;border-top-color:#169b7b;border-radius:50%;animation:r .8s linear infinite}
    .e{color:#7b2634}
    button{padding:.7rem 1.1rem;border:0;border-radius:6px;background:#08765d;color:#fff;font:inherit;cursor:pointer}
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="c" aria-live="polite">
    <div class="s" aria-hidden="true"></div>
    <p>Consultando los datos vigentes…</p>
    <noscript>Active JavaScript para consultar el portal.</noscript>
  </main>
  <script src="./datos-vigentes.js"></script>
  <script>
    (async function () {
      try {
        var result = await PortalVigente.load();
        document.open();
        document.write(result.html);
        document.close();
      } catch (error) {
        console.error("No se pudo cargar la fuente vigente del portal.", error);
        var main = document.querySelector("main");
        main.replaceChildren();
        var message = document.createElement("p");
        message.className = "e";
        message.textContent = "No fue posible consultar los datos vigentes. Reintente en unos momentos.";
        var retry = document.createElement("button");
        retry.textContent = "Reintentar";
        retry.addEventListener("click", function () { location.reload(); });
        main.append(message, retry);
      }
    })();
  </script>
</body>
</html>
